[package]
name = "jman-core"
description = "Core logic for jman: JDK detection, switching, setup and downloads."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
dirs = "6"
dunce = "1"
which = "8"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
zip = { version = "5", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
junction = "1"
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3"
